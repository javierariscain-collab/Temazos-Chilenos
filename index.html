<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hitster Chile</title>

<!-- iOS PWA meta -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hitster Chile">
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">

<!-- Inline SVG favicon + apple-touch-icon so install works without extra files -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D1B2A'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23E63946' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23F1FAEE'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230D1B2A'/%3E%3Ccircle cx='90' cy='90' r='40' fill='none' stroke='%23E63946' stroke-width='10'/%3E%3Ccircle cx='90' cy='90' r='11' fill='%23F1FAEE'/%3E%3C/svg%3E">

<!-- Inline manifest -->
<link rel="manifest" href='data:application/manifest+json,{"name":"Hitster Chile","short_name":"Hitster","start_url":".","display":"standalone","background_color":"%230D1B2A","theme_color":"%230D1B2A","orientation":"portrait"}'>

<style>
  :root {
    --bg: #0D1B2A;
    --bg-2: #0a1622;
    --accent: #E63946;
    --accent-soft: rgba(230, 57, 70, 0.22);
    --fg: #F1FAEE;
    --muted: #457B9D;
    --muted-2: #2c4a63;
    --radius: 999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior: none;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    /* subtle radial vignette so the navy doesn't feel flat */
    background:
      radial-gradient(120% 80% at 50% 0%, #14283f 0%, var(--bg) 55%, var(--bg-2) 100%);
  }

  /* Completely hidden YT iframe */
  #yt-host {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .stage {
    height: 100dvh;
    width: 100vw;
    padding: calc(28px + var(--safe-top)) 24px calc(28px + var(--safe-bot));
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 20px;
  }

  /* ===== Header ===== */
  .brand {
    text-align: center;
    color: var(--accent);
    font-weight: 800;
    letter-spacing: 0.32em;
    font-size: 13px;
    text-transform: uppercase;
  }
  .brand .dot {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    vertical-align: middle;
    margin: 0 10px 2px;
    box-shadow: 0 0 8px var(--accent);
  }

  /* ===== Center column ===== */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    min-height: 0;
  }

  /* ===== Emoji + pulsing rings ===== */
  .puck {
    position: relative;
    width: 180px;
    height: 180px;
    display: grid;
    place-items: center;
  }
  .puck .emoji {
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
    position: relative;
    z-index: 2;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    pointer-events: none;
  }
  .playing .ring {
    animation: pulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  .playing .ring:nth-child(2) { animation-delay: 0.55s; }
  .playing .ring:nth-child(3) { animation-delay: 1.1s; }
  @keyframes pulse {
    0%   { transform: scale(0.55); opacity: 0.85; border-width: 3px; }
    80%  { transform: scale(1.35); opacity: 0;    border-width: 1px; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  /* ===== Big primary button ===== */
  .primary {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: var(--accent);
    color: var(--fg);
    font-family: inherit;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    width: 168px;
    height: 168px;
    border-radius: 50%;
    box-shadow:
      0 16px 40px -8px rgba(230, 57, 70, 0.55),
      0 0 0 1px rgba(255,255,255,0.06) inset,
      0 -8px 24px rgba(0,0,0,0.25) inset;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 12px;
    line-height: 1.2;
  }
  .primary:active {
    transform: scale(0.96);
    box-shadow:
      0 8px 24px -6px rgba(230, 57, 70, 0.45),
      0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  .primary[disabled] {
    background: var(--muted-2);
    color: rgba(241,250,238,0.5);
    box-shadow: none;
    cursor: not-allowed;
  }
  .primary.is-playing {
    background: transparent;
    color: var(--fg);
    box-shadow:
      0 0 0 2px var(--accent) inset,
      0 16px 40px -16px rgba(230, 57, 70, 0.4);
  }

  /* ===== Volume ===== */
  .volume {
    width: min(360px, 80vw);
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
  }
  .volume svg { flex: 0 0 auto; }
  .volume input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    background: linear-gradient(
      to right,
      var(--accent) 0%,
      var(--accent) var(--vol, 70%),
      var(--muted-2) var(--vol, 70%),
      var(--muted-2) 100%
    );
    border-radius: 999px;
    outline: none;
  }
  .volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 4px rgba(241,250,238,0.08);
    border: none;
    cursor: pointer;
  }
  .volume input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    border: none;
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.04em;
    opacity: 0.85;
  }

  .player-ui {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* ===== Error state ===== */
  .error-card {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  .error-card .icon { font-size: 56px; }
  .error-card .msg {
    color: var(--accent);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.02em;
    max-width: 280px;
    line-height: 1.4;
  }
  .error-card .retry {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    color: var(--fg);
    border: 1.5px solid var(--muted);
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .error-card .retry:active { transform: scale(0.97); }

  /* ===== State toggles ===== */
  body[data-state="error"] .center > .player-ui,
  body[data-state="empty"] .center > .player-ui {
    display: none;
  }
  body[data-state="error"] .error-card,
  body[data-state="empty"] .error-card {
    display: flex;
  }
  body[data-state="empty"] .error-card .icon { font-size: 56px; }
  body[data-state="empty"] .error-card .msg { color: var(--fg); font-weight: 500; }
  body[data-state="empty"] .error-card .retry { display: none; }
  body[data-state="empty"] .footer { opacity: 1; }

  /* hide volume until first interaction succeeds? keep visible — set initial */
  body[data-state="loading"] .primary {
    background: var(--muted-2);
    color: rgba(241,250,238,0.7);
  }

  /* tiny status pip near brand */
  .status-pip {
    display: inline-block;
    margin-left: 8px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted-2);
    vertical-align: middle;
    transition: background 0.2s, box-shadow 0.2s;
  }
  body[data-state="playing"] .status-pip {
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
  }
  body[data-state="paused"] .status-pip {
    background: #facc15;
  }
  body[data-state="error"] .status-pip,
  body[data-state="empty"] .status-pip {
    background: var(--accent);
  }
</style>
</head>
<body data-state="waiting">

<!-- Hidden YT iframe host -->
<div id="yt-host"><div id="yt-player"></div></div>

<main class="stage">

  <header class="brand">TEMAZOS CHILENOS</header>

  <section class="center">

    <!-- Normal player UI -->
    <div class="player-ui">
      <div class="puck" id="puck">
        <span class="ring"></span>
        <span class="ring"></span>
        <span class="ring"></span>
        <span class="emoji">🎵</span>
      </div>

      <button class="primary" id="btn" type="button" aria-label="Reproducir">
        <span id="btn-label">▶ INICIAR</span>
      </button>

      <div class="volume" aria-label="Volumen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/></svg>
        <input type="range" id="vol" min="0" max="100" value="70" step="1" aria-label="Volumen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </div>
    </div>

    <!-- Error / empty state card -->
    <div class="error-card" id="err">
      <div class="icon" id="err-icon">⚠️</div>
      <div class="msg" id="err-msg">No se pudo cargar</div>
      <button class="retry" id="retry" type="button">Reintentar</button>
    </div>

  </section>

  <footer class="footer" id="footer">
    Escanea el próximo QR para continuar
  </footer>

</main>

<script>
(function () {
  // ---------- Read ?v= ----------
  function getVideoId () {
    var p = new URLSearchParams(location.search);
    var v = (p.get('v') || '').trim();
    // Accept full URLs pasted in by accident; extract id
    var m = v.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(v)) return v;
    return null;
  }

  var VIDEO_ID = getVideoId();

  // ---------- DOM refs ----------
  var body = document.body;
  var btn = document.getElementById('btn');
  var btnLabel = document.getElementById('btn-label');
  var puck = document.getElementById('puck');
  var vol = document.getElementById('vol');
  var err = document.getElementById('err');
  var errIcon = document.getElementById('err-icon');
  var errMsg = document.getElementById('err-msg');
  var retry = document.getElementById('retry');
  var footer = document.getElementById('footer');

  function setVolFillCss (val) {
    vol.style.setProperty('--vol', val + '%');
  }
  setVolFillCss(vol.value);

  // ---------- State machine ----------
  // states: waiting | loading | playing | paused | error | empty
  function setState (s) {
    body.dataset.state = s;
    puck.classList.toggle('playing', s === 'playing');
    btn.classList.toggle('is-playing', s === 'playing');

    if (s === 'waiting')      { btnLabel.textContent = '▶ INICIAR';   btn.disabled = false; }
    else if (s === 'loading') { btnLabel.textContent = '…';            btn.disabled = true;  }
    else if (s === 'playing') { btnLabel.textContent = '⏸ PAUSA';     btn.disabled = false; }
    else if (s === 'paused')  { btnLabel.textContent = '▶ CONTINUAR'; btn.disabled = false; }
  }

  // ---------- Empty (no ?v=) ----------
  if (!VIDEO_ID) {
    errIcon.textContent = '📷';
    errMsg.textContent = 'Escanea un QR para comenzar';
    footer.textContent = 'Apunta la cámara a una carta Hitster';
    setState('empty');
    return;
  }

  // ---------- iOS audio session keep-alive ----------
  // Silent oscillator through a WebAudio context, kept running so iOS
  // doesn't aggressively suspend the audio session between taps.
  var audioCtx = null;
  function primeAudioSession () {
    try {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      gain.gain.value = 0.0001; // effectively silent
      osc.frequency.value = 1;  // sub-audible
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(0);
    } catch (e) { /* ignore */ }
  }

  // ---------- YT IFrame API ----------
  var player = null;
  var apiReady = false;
  var pendingPlay = false;

  window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    buildPlayer();
  };

  function buildPlayer () {
    if (player) return;
    player = new YT.Player('yt-player', {
      width: '1', height: '1',
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        fs: 0,
        iv_load_policy: 3,
        modestbranding: 1,
        rel: 0,
        showinfo: 0,
        playsinline: 1
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError
      }
    });
  }

  function onPlayerReady () {
    try { player.setVolume(parseInt(vol.value, 10)); } catch (e) {}
    if (pendingPlay) {
      pendingPlay = false;
      try { player.playVideo(); } catch (e) {}
    } else {
      setState('waiting');
    }
  }

  function onPlayerStateChange (e) {
    // YT.PlayerState: -1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued
    if (!e || e.data == null) return;
    switch (e.data) {
      case 1: setState('playing'); break;
      case 2: setState('paused');  break;
      case 0: setState('paused');  break; // ended — return to a resumable-looking state
      case 3: /* buffering, keep current state */ break;
      case 5: /* cued */ break;
    }
  }

  function onPlayerError (e) {
    // 2 invalid param, 5 html5 player error, 100 not found / private,
    // 101/150 embedding not allowed (often region/embed restricted)
    var code = e && e.data;
    if (code === 101 || code === 150) {
      errIcon.textContent = '🚫';
      errMsg.textContent = 'Video no disponible, escanea de nuevo';
    } else if (code === 100) {
      errIcon.textContent = '❓';
      errMsg.textContent = 'Video no encontrado';
    } else {
      errIcon.textContent = '⚠️';
      errMsg.textContent = 'No se pudo cargar';
    }
    setState('error');
  }

  // ---------- Load API script ----------
  (function loadAPI () {
    if (window.YT && window.YT.Player) { apiReady = true; buildPlayer(); return; }
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function () {
      errIcon.textContent = '📡';
      errMsg.textContent = 'Sin conexión a YouTube';
      setState('error');
    };
    document.head.appendChild(tag);
  })();

  // ---------- Button: play/pause ----------
  btn.addEventListener('click', function () {
    primeAudioSession(); // first gesture unlocks iOS audio
    var s = body.dataset.state;

    if (!player || !apiReady) {
      pendingPlay = true;
      setState('loading');
      return;
    }

    if (s === 'playing') {
      try { player.pauseVideo(); } catch (e) {}
    } else if (s === 'paused' || s === 'waiting') {
      try {
        player.setVolume(parseInt(vol.value, 10));
        player.playVideo();
      } catch (e) {}
    } else if (s === 'error') {
      // shouldn't reach — retry button handles this
      setState('loading');
      try { player.loadVideoById(VIDEO_ID); } catch (e) {}
    }
  });

  // ---------- Retry ----------
  retry.addEventListener('click', function () {
    primeAudioSession();
    setState('loading');
    try {
      if (player && player.loadVideoById) {
        player.loadVideoById(VIDEO_ID);
      } else {
        // Hard rebuild
        location.reload();
      }
    } catch (e) {
      location.reload();
    }
  });

  // ---------- Volume ----------
  function applyVolume () {
    var v = parseInt(vol.value, 10);
    setVolFillCss(v);
    if (player && player.setVolume) {
      try { player.setVolume(v); } catch (e) {}
    }
  }
  vol.addEventListener('input', applyVolume);
  vol.addEventListener('change', applyVolume);

  // ---------- Visibility: keep audio session alive when returning ----------
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  });

  // Prevent accidental pinch / double-tap zoom on the controls
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
